<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مؤقت اللعب السريع</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #f7f4ef;
            color: #2c2c2c;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 400px;
            gap: 25px;
        }

        /* الثواني فوق الدائرة */
        .timer-display {
            font-size: 5rem;
            font-weight: 800;
            color: #1a1a1a;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* الزر الكريستالي بالمنتصف */
        .main-btn {
            width: 240px;
            height: 240px;
            border-radius: 50%;
            border: 8px solid #e2dacd;
            background: linear-gradient(145deg, #ede6db, #dfd5c6);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.08), 
                        inset 0 2px 4px rgba(255, 255, 255, 0.8);
            color: #2c2c2c;
            font-size: 2.2rem;
            font-weight: 700;
            cursor: pointer;
            outline: none;
            transition: transform 0.05s ease, box-shadow 0.05s ease, background 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }

        .main-btn:active {
            transform: scale(0.94);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1), 
                        inset 0 4px 8px rgba(0, 0, 0, 0.1);
            background: #d8cebe;
        }

        /* إعدادات الخيارات تحت الدائرة */
        .settings-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        .settings-title {
            font-size: 1rem;
            color: #666;
            font-weight: 600;
        }

        .options-grid {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }

        .opt-btn {
            padding: 10px 18px;
            border-radius: 12px;
            border: 2px solid #e2dacd;
            background-color: #f0eae1;
            color: #4a4a4a;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .opt-btn.active {
            background-color: #2c2c2c;
            color: #f7f4ef;
            border-color: #2c2c2c;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 1. الشاشة الرقمية للثواني -->
        <div class="timer-display" id="timerDisplay">10</div>

        <!-- 2. الزر الكبير بالمنتصف -->
        <button class="main-btn" id="startBtn">بدء</button>

        <!-- 3. خيارات الوقت أسفل الزر -->
        <div class="settings-container">
            <span class="settings-title">اختر وقت الجولة:</span>
            <div class="options-grid">
                <button class="opt-btn active" onclick="setDuration(10)">10</button>
                <button class="opt-btn" onclick="setDuration(15)">15</button>
                <button class="opt-btn" onclick="setDuration(20)">20</button>
                <button class="opt-btn" onclick="setDuration(25)">25</button>
                <button class="opt-btn" onclick="setDuration(30)">30</button>
            </div>
        </div>
    </div>

    <script>
        let selectedDuration = 10;
        let remainingTime = 10;
        let timer = null;
        let audioCtx = null;

        const timerDisplay = document.getElementById('timerDisplay');
        const startBtn = document.getElementById('startBtn');
        const optButtons = document.querySelectorAll('.opt-btn');

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // صوت البدء: بيب خاطف وقصير جداً (0.05 ثانية) ونغمة حادة وعالية (1200Hz)
        function playStartBeep() {
            initAudio();
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
            
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        // صوت الانتهاء: تيتتت طويل ومميز
        function playEndBeep() {
            initAudio();
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(450, audioCtx.currentTime);
            
            gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.8);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.8);
        }

        // اختيار الوقت
        function setDuration(seconds) {
            selectedDuration = seconds;
            remainingTime = seconds;
            timerDisplay.textContent = remainingTime;
            
            optButtons.forEach(btn => {
                if(parseInt(btn.textContent) === seconds) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            if (timer) {
                clearInterval(timer);
                timer = null;
            }
        }

        // بدء وعودة العد فور الضغط
        function handleStart() {
            playStartBeep();

            if (timer) {
                clearInterval(timer);
            }

            remainingTime = selectedDuration;
            timerDisplay.textContent = remainingTime;

            timer = setInterval(() => {
                remainingTime--;
                timerDisplay.textContent = remainingTime;

                if (remainingTime <= 0) {
                    clearInterval(timer);
                    timer = null;
                    playEndBeep();
                }
            }, 1000);
        }

        startBtn.addEventListener('click', handleStart);
    </script>
</body>
</html>
